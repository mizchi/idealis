[package]
name = "roracle-native-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.16.2", default-features = false, features = ["napi4", "serde-json", "dyn-symbols"] }
napi-derive = "=3.7.1"
roracle = { path = "../../../../crates/roracle" }
serde_json = "1.0"

[build-dependencies]
napi-build = "=2.6.0"
