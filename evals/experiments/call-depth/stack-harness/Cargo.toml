[package]
name = "call-depth-stack-harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
oracle-peak = []

[dependencies]
rtla = { path = "../../../../crates/rtla" }
rtla-compiler = { path = "../../../../crates/rtla-compiler" }
rtlc = { path = "../../../../crates/rtlc" }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
