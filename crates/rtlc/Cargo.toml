[package]
name = "rtlc"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Portable model checking for a finite TLA+ fragment with TLC-compatible semantics"
repository = "https://github.com/mizchi/idealis"
readme = "README.md"
license = "MIT"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[lib]
bench = false

[[bench]]
name = "safety"
path = "src/benchmarks.rs"
harness = false

[[bench]]
name = "coverage"
path = "src/coverage_benchmarks.rs"
harness = false

[[bench]]
name = "expansions"
path = "src/expansion_benchmarks.rs"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "symmetry"
path = "src/symmetry_benchmarks.rs"
harness = false
