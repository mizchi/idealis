[package]
name = "idealis-check"
version = "0.1.0-alpha.0"
edition = "2024"
description = "One entry point that answers an Idealis model's questions with the reference evaluator, rtlc or ralloy's SAT"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "idealis-check"
path = "src/main.rs"

[dependencies]
idealis-core = { path = "../idealis-core" }
ralloy = { path = "../ralloy" }
idealis-model = { path = "../idealis-model" }
rprob = { path = "../rprob" }
rusmt = { path = "../rusmt" }
idealis-spec = { path = "../idealis-spec" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
roracle = { path = "../roracle" }

# The engines run the corpus in tests; optimize them in debug builds.
[profile.dev.package."*"]
opt-level = 2
