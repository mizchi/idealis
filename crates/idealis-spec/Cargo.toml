[package]
name = "idealis-spec"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Idealis domain vocabulary, rules and links to formal properties and implementations"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[lib]
crate-type = ["rlib"]

[dependencies]
rmodel = { path = "../rmodel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
rprob = { path = "../rprob" }
idealis-core = { path = "../idealis-core" }
ralloy = { path = "../ralloy" }
roracle = { path = "../roracle" }

# The engines run the corpus in tests; optimize them in debug builds.
[profile.dev.package."*"]
opt-level = 2
