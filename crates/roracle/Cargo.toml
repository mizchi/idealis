[package]
name = "roracle"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Portable differential tests, recorded oracle replay and comparative benchmarks"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
typescript = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "wire"
harness = false

[[example]]
name = "typescript"
required-features = ["typescript"]
