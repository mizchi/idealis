[package]
name = "rtla-compiler"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Lower rtla syntax into rtlc finite model checking IR"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[dependencies]
rtla = { path = "../rtla", version = "0.1.0-alpha.0" }
rtlc = { path = "../rtlc", version = "0.1.0-alpha.0" }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compatibility"
harness = false

[[bench]]
name = "frontend"
harness = false

[[bench]]
name = "recursive_actions"
harness = false

[[bench]]
name = "frontend_semantics"
harness = false

[[bench]]
name = "quint_generated"
harness = false

[[bench]]
name = "nesting_chains"
harness = false
