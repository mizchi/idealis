[package]
name = "rmodel"
version = "0.1.0-alpha.0"
edition = "2024"
description = "One model of structure, state and behavior, lowered to Alloy 6 and TLA+ for idealis engines"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[lib]
crate-type = ["rlib"]

[dependencies]

[dev-dependencies]
idealis-core = { path = "../idealis-core" }
ralloy = { path = "../ralloy" }
serde_json = "1.0"
sha2 = "0.10.9"

# The engines run the corpus in tests; optimize them in debug builds.
[profile.dev.package."*"]
opt-level = 2
