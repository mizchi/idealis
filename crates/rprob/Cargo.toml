[package]
name = "rprob"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Experimental ProB-inspired bitset explorer for finite Idealis sets and relations"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[dependencies]
idealis-semantics = { path = "../idealis-semantics" }
idealis-syntax = { path = "../idealis-syntax" }

[dev-dependencies]
idealis-model = { path = "../idealis-model" }
