name: Fuzz smoke
on:
  pull_request:
    paths:
      - crates/idealis-connect/**
      - evals/experiments/structured-fuzz/**
      - tests/structured-fuzz/**
      - .github/workflows/fuzz.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: just testing-build
      - run: cargo build --release --locked --manifest-path evals/experiments/structured-fuzz/rust/Cargo.toml
      - run: rustup toolchain install nightly-2026-08-27 --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-08-27 metadata --locked --format-version 1 --manifest-path evals/experiments/structured-fuzz/fuzz/Cargo.toml > /dev/null
      - run: cargo +nightly-2026-08-27 fuzz build --sanitizer address --fuzz-dir evals/experiments/structured-fuzz/fuzz
      - run: node dist/evals/experiments/structured-fuzz/run.js smoke .artifacts/fuzz-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-smoke
          path: .artifacts/fuzz-smoke
