name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - run: node dist/scripts/release.js "$GITHUB_REF_NAME"
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - run: just check
      - run: just package-prepare
      - run: node --test dist/tests/alloy-subset/contract-test.js
      - run: node --test dist/tests/alloy-instance/contract-test.js
      - run: just vitest --project=alloy
      - run: node --test dist/tests/testing-core/contract-test.js
      - run: just vitest --project=testing
      - run: just portable-test
      - run: just usable-test
      - run: just package-test
      - run: just wasm-test
      - run: npm install --global npm@11
      - run: node dist/scripts/release.js "$GITHUB_REF_NAME" --publish
        env:
          GH_TOKEN: ${{ github.token }}
