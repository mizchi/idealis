name: CI
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Workloads as a JSON array
        type: string
        default: '["rtlc-tests","native-core","wasm-core","wasi-cli"]'
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - name: Prepare toolchains
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustc -vV
          clang --version
          archive=wild-linker-0.11.0-x86_64-unknown-linux-gnu
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/wild-linker/wild/releases/download/0.11.0/$archive.tar.gz"
          echo "25012a78de164686f552b7703b5d0223adab4829c79cd1fb351108221d61c7d8  $archive.tar.gz" | sha256sum -c -
          tar -xzf "$archive.tar.gz" --strip-components=1 "$archive/wild"
          "$RUNNER_TEMP/wild" --version
      - run: python3 evals/experiments/ci-linker/compare.py "$WORKLOAD"
        env:
          WORKLOAD: ${{ matrix.task }}
