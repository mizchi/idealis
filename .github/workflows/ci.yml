name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_tlc_results:
        description: Restore and save TLC results across runs
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI: true
jobs:
  sdk:
    name: SDK and crates (1/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject tracked Rust build outputs
        run: test -z "$(git ls-files -- ':(glob)**/target/**')"
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: just check
      - run: node --test dist/tests/connect/conformance.test.js
      - run: just connect-bindings-test
      - name: Check crate support declarations and links
        run: just support-check
      - run: node --test dist/scripts/check-support-test.js
      - run: cargo fmt --manifest-path evals/experiments/sat-foundation/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/experiments/sat-foundation/rust/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path evals/experiments/sat-foundation/rust/Cargo.toml
      - run: cargo fmt --manifest-path crates/roracle/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/roracle/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path crates/roracle/Cargo.toml
      - run: cargo test --locked --manifest-path crates/roracle/Cargo.toml --bench wire
      - run: just oracle-types-check
      - run: just oracle-native-test
      - run: cargo fmt --manifest-path evals/experiments/workspace-oracle/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/experiments/workspace-oracle/rust/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path evals/experiments/workspace-oracle/rust/Cargo.toml
      - run: cargo fmt --manifest-path evals/experiments/oracle-comparison/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/experiments/oracle-comparison/rust/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path crates/idealis-connect/Cargo.toml -- --check
      - run: cargo fmt --manifest-path crates/idealis-cli/Cargo.toml -- --check
      - run: cargo clippy --all-targets --all-features --locked --manifest-path crates/idealis-connect/Cargo.toml -- -D warnings
      - run: cargo clippy --all-targets --locked --manifest-path crates/idealis-cli/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --all-features --locked --manifest-path crates/idealis-connect/Cargo.toml
      - run: cargo test --all-targets --locked --manifest-path crates/idealis-cli/Cargo.toml
      - run: just testing-build
      - run: node --test dist/tests/testing-core/contract-test.js
      - run: just vitest --project=testing
      - run: cargo fmt --manifest-path evals/experiments/controlled-schedules/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/experiments/controlled-schedules/rust/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path evals/experiments/controlled-schedules/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/experiments/controlled-schedules/rust/Cargo.toml
      - run: cargo run --release --locked --example loom --manifest-path evals/experiments/controlled-schedules/rust/Cargo.toml
      - run: node --test dist/tests/controlled-schedules/contract-test.js
      - run: just vitest --project=schedules
      - run: cargo fmt --manifest-path evals/experiments/structured-fuzz/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/experiments/structured-fuzz/rust/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path evals/experiments/structured-fuzz/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/experiments/structured-fuzz/rust/Cargo.toml
      - run: node --test dist/tests/structured-fuzz/contract-test.js
      - run: just vitest --project=fuzz
      - run: cargo fmt --manifest-path crates/ralloy/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/ralloy/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path crates/ralloy/Cargo.toml
      - run: cargo fmt --manifest-path crates/rusmt/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/rusmt/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path crates/rusmt/Cargo.toml
      - run: just mutation
      - run: just evaluate
      - run: just replay-evaluation
      - run: just eval-loop evals/plans/0002-mixed-depth.json ci-mixed .artifacts/evals
      - run: just replay-loop .artifacts/evals/ci-mixed-confirmation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence-sdk
          path: |
            .mutator/report
            .artifacts/evaluation
            .artifacts/evals
          if-no-files-found: warn

  wasm:
    name: Wasm and packages (2/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - run: cargo build --release --locked --manifest-path evals/experiments/sat-foundation/rust/Cargo.toml
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path evals/experiments/sat-foundation/rust/Cargo.toml
      - run: node --test dist/tests/sat-foundation/contract-test.js
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path crates/roracle/Cargo.toml
      - run: cargo build --release --locked --manifest-path crates/roracle/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/experiments/workspace-oracle/rust/Cargo.toml
      - run: node --test dist/tests/workspace-oracle/contract-test.js
      - run: cargo build --release --locked --manifest-path evals/experiments/oracle-comparison/rust/Cargo.toml
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path evals/experiments/oracle-comparison/rust/Cargo.toml
      - run: just ralloy-build
      - run: node --test dist/tests/alloy-subset/contract-test.js
      - run: node --test dist/tests/alloy-instance/contract-test.js
      - run: just vitest --project=alloy
      - run: cargo build --release --locked --manifest-path crates/rusmt/Cargo.toml
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path crates/rusmt/Cargo.toml
      - run: node --test dist/tests/smt-subset/contract-test.js dist/tests/smt-expansion/contract-test.js dist/tests/smt-scripts/contract-test.js dist/tests/smt-tuning/contract-test.js
      - run: just vitest --project=smt
      - run: just wasm-test
      - run: node --test dist/tests/oracle-tuning/wasm-test.js
      - run: node --test dist/tests/workspace-oracle/catalog-test.js
      - run: just runtime-test
      - name: Fetch locked dependencies for offline package checks
        run: |
          for manifest in crates/*/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
          done
      - run: just package-prepare
      - run: just package-test
      - run: just usable-eval .artifacts/usable-evaluation
      - run: just usable-replay .artifacts/usable-evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence-wasm
          path: |
            .artifacts/packages
            .artifacts/usable-evaluation
          if-no-files-found: warn

  portable-build:
    name: Build shared portable binaries
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify portable build inputs
        id: inputs
        run: |
          fingerprint=$({
            git ls-tree HEAD -- crates justfile .cargo rust-toolchain rust-toolchain.toml .github/workflows/ci.yml
            rustc -vV
            cargo -V
            echo "$ImageOS $ImageVersion"
          } | sha256sum | cut -d' ' -f1)
          echo "key=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: portable-cache
        with:
          key: portable-linux-${{ runner.arch }}-v1-${{ steps.inputs.outputs.key }}
          path: ${{ runner.temp }}/portable.tar
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        if: steps.portable-cache.outputs.cache-hit != 'true'
      - name: Build and archive native and Wasm binaries
        if: steps.portable-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          just portable-build
          tar -cf "$RUNNER_TEMP/portable.tar" \
            crates/idealis-core/target/release/idealis-core \
            crates/idealis-core/target/wasm32-unknown-unknown/release/idealis_core.wasm \
            crates/roracle/target/release/roracle \
            crates/roracle/target/wasm32-unknown-unknown/release/roracle.wasm
      - id: bundle
        run: echo "name=portable-binaries-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ runner.temp }}/portable.tar
          if-no-files-found: error

  model:
    name: Model checking (3/4)
    needs: portable-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --manifest-path crates/idealis-core/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/idealis-core/Cargo.toml -- -D warnings
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.portable-build.outputs.artifact }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/portable.tar"
      - run: node dist/scripts/prepare-tlc-modules.js
      - run: node --test dist/tests/tlc-differential/compare-test.js dist/tests/tlc-differential/standard-modules-test.js
      - name: Identify TLC-compatible checkers
        id: tlc-build
        run: |
          build=$(node --input-type=module -e "import { tlcBuild } from './dist/tests/ci/tlc-build.js'; console.log(tlcBuild())")
          echo "build=$build" >> "$GITHUB_OUTPUT"
          inputs=$(git rev-parse HEAD:tests HEAD:fixtures HEAD:evals HEAD:crates | sha256sum | cut -d' ' -f1)
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          echo "IDEALIS_TLC_RESULTS=.artifacts/tlc-results" >> "$GITHUB_ENV"
      - name: Restore model check results for this checker build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_tlc_results }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/tlc-results/${{ steps.tlc-build.outputs.build }}
          key: tlc-results-v1-${{ steps.tlc-build.outputs.build }}-${{ steps.tlc-build.outputs.inputs }}
          restore-keys: |
            tlc-results-v1-${{ steps.tlc-build.outputs.build }}-
      - run: node --test dist/tests/ci/tlc-result-cache.test.js
      - run: just -f .github/prebuilt.just cache-test
      - run: just -f .github/prebuilt.just expansion-test
      - run: just -f .github/prebuilt.just expansion-eval .artifacts/cache-expansion-eval
      - run: just -f .github/prebuilt.just expansion-replay .artifacts/cache-expansion-eval .artifacts/cache-expansion-replay
      - run: just -f .github/prebuilt.just rtla-build
      - run: node --test dist/tests/rtla-compatibility/contract-test.js dist/tests/symbolic-operators/contract-test.js
      - run: cargo build --locked --manifest-path crates/rtla-compiler/Cargo.toml --example analysis_roles
      - run: node --test dist/tests/tlc-differential/analysis-parity-test.js dist/tests/tlc-differential/frame-decoder-test.js dist/tests/p0-checker/contract-test.js
      - run: node dist/evals/experiments/rtla-compiler/evaluate.js .artifacts/rtla-compiler
      - run: node --test dist/tests/quint-generated/contract-test.js
      - run: node --test dist/tests/frontier-safety/contract-test.js
      - run: node --test dist/tests/readme-comparison/contract-test.js
      - run: node --test dist/tests/rust-safety/contract-test.js dist/tests/collections-temporal/contract-test.js dist/tests/tlc-differential/compare-test.js dist/tests/nesting-chains/contract-test.js dist/tests/parallel-safety/contract-test.js
      # The regression suite measures native execution against a wall-clock budget.
      - run: node --test dist/tests/tlc-differential/regression-test.js
      - run: node dist/evals/experiments/collections-temporal/evaluate.js .artifacts/collections-temporal
      - run: node dist/evals/experiments/collections-temporal/replay.js .artifacts/collections-temporal
      - run: node dist/evals/experiments/rust-safety/evaluate.js .artifacts/rust-safety
      - run: node dist/evals/experiments/rust-safety/replay.js .artifacts/rust-safety
      - run: just -f .github/prebuilt.just portable-test
      - run: just usable-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence-model
          path: |
            .artifacts/rust-safety
            .artifacts/collections-temporal
            .artifacts/frontier-safety
            .artifacts/readme-comparison
            .artifacts/rtla-compiler
            .artifacts/cache-expansion-eval
            .artifacts/cache-expansion-replay
          if-no-files-found: warn

  go:
    name: Go and cross-language (4/4)
    needs: portable-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.portable-build.outputs.artifact }}
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/portable.tar"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache-dependency-path: adapters/go/go.sum
      - run: node dist/evals/experiments/go/prepare.js
      - run: test -z "$(gofmt -l adapters/go)"
      - run: go mod verify && go vet ./...
        working-directory: adapters/go
      - run: CGO_ENABLED=0 go test -count=1 ./...
        working-directory: adapters/go
      - run: go test -race -count=1 ./...
        working-directory: adapters/go
      - run: node dist/scripts/go-consumer.js
      - run: cargo fmt --manifest-path evals/experiments/shared-oracle-rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/experiments/shared-oracle-rust/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path evals/experiments/shared-oracle-rust/Cargo.toml
      - run: CGO_ENABLED=0 go build -o ../../.artifacts/go/counter-replay ./cmd/counter-replay
        working-directory: adapters/go
      - run: node --test dist/tests/cross-language/contract-test.js
      - run: node dist/evals/experiments/cross-language/evaluate.js regression .artifacts/shared-oracle
      - run: node dist/evals/experiments/cross-language/replay.js .artifacts/shared-oracle
      - run: CGO_ENABLED=0 go build -o ../../.artifacts/go/history-check ./cmd/history-check
        working-directory: adapters/go
      - run: CGO_ENABLED=0 go build -o ../../.artifacts/go/finite-bench ./cmd/finite-bench
        working-directory: adapters/go
      - run: node --test dist/tests/async-tuning/contract-test.js
      - run: node dist/evals/experiments/async-tuning/evaluate.js regression .artifacts/async-tuning
      - run: node dist/evals/experiments/async-tuning/replay.js .artifacts/async-tuning
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence-go
          path: |
            .artifacts/go
            .artifacts/shared-oracle
            .artifacts/async-tuning
          if-no-files-found: warn

  cache-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formal/cache
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          leanchecker: "false"
      - run: just cache-proof .artifacts/cache-proof
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cache-proof
          path: .artifacts/cache-proof
